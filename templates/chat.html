<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Room: {{ room_id }}</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #343a40; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; background: #e5ddd5; display: flex; flex-direction: column; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 8px; max-width: 70%; background: white; word-wrap: break-word; }
        .my-message { align-self: flex-end; background: #dcf8c6; margin-left: auto; }
        
        /* 画像プレビュー用スタイル */
        .msg-image { max-width: 100%; max-height: 300px; border-radius: 4px; margin-top: 5px; display: block; }
        
        footer { padding: 20px; background: white; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        
        /* クリップボタンの装飾 */
        .file-label { cursor: pointer; font-size: 24px; color: #666; user-select: none; }
        #file-input { display: none; }

        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <header>
        <span>部屋ID: <strong>{{ room_id }}</strong></span>
        <a href="{{ url_for('home') }}" style="color: white; text-decoration: none;">ホームへ戻る</a>
    </header>

    <div id="chat-box">
        {% for msg in messages %}
            <div class="message {% if msg.username == username %}my-message{% endif %}">
                <small style="color: #888;">{{ msg.username }}</small>
                <div class="msg-content" data-raw="{{ msg.content }}"></div>
            </div>
        {% endfor %}
    </div>

    <footer>
        <label class="file-label" title="画像を選択">📎
            <input type="file" id="file-input" accept="image/*,image/gif">
        </label>
        <input type="text" id="msg-input" placeholder="メッセージ入力または画像を貼り付け..." autocomplete="off">
        <button id="send-btn">送信</button>
    </footer>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const room = "{{ room_id }}";
        const username = "{{ username }}";
        const chatBox = document.getElementById('chat-box');
        const fileInput = document.getElementById('file-input');
        const msgInput = document.getElementById('msg-input');

        // base64形式のテキストをHTML（画像タグ）に変換する関数
        function parseMessage(text) {
            if (typeof text === "string" && text.startsWith("base64{") && text.endsWith("}")) {
                const base64Data = text.slice(7, -1);
                return `<img src="${base64Data}" class="msg-image">`;
            }
            return text;
        }

        // ページ読み込み時に過去ログを解析
        document.querySelectorAll('.msg-content').forEach(el => {
            el.innerHTML = parseMessage(el.getAttribute('data-raw'));
        });

        socket.on('connect', () => {
            socket.emit('join', { room: room });
        });

        // 共通のファイル送信処理
        function sendFileAsBase64(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64Str = e.target.result;
                socket.emit('message', { msg: `base64{${base64Str}}`, room: room });
            };
            reader.readAsDataURL(file);
        }

        // 1. クリップボタン（アップロード）
        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if (file) {
                sendFileAsBase64(file);
                fileInput.value = ''; 
            }
        };

        // 2. クリップボード貼り付け（Ctrl+V）
        msgInput.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    sendFileAsBase64(blob);
                }
            }
        });

        document.getElementById('send-btn').onclick = sendMessage;
        msgInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        function sendMessage() {
            if (msgInput.value.trim() !== "") {
                socket.emit('message', { msg: msgInput.value, room: room });
                msgInput.value = '';
            }
        }

        socket.on('render_msg', (data) => {
            const div = document.createElement('div');
            div.classList.add('message');
            if (data.user === username) div.classList.add('my-message');
            
            const parsedContent = parseMessage(data.msg);
            
            div.innerHTML = `<small style="color: #888;">${data.user}</small><div>${parsedContent}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
